name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
      - name: Build installer and portable app
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          ./packaging/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: TempMail-OTP-Hub-Windows
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/* --verify-tag --title "TempMail OTP Hub $env:GITHUB_REF_NAME" --notes-file packaging/release-notes.md
